# Brief #7 Deliverable 0 — the verification suite runs in CI.
# Covers the design-rule enforcement, font registry, block, presentation,
# golden, and end-to-end verification suites (packages only: no secrets,
# no model calls, fully deterministic).
name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: foundation checks
        run: pnpm --filter @arche/foundation build check-types lint check-token-only check-manifest-template
      - name: registry-core suites
        run: pnpm --filter @arche/registry-core test:rules test:fonts test:presentation test:blocks test:verification test:goldens
